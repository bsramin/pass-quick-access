name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So the release workflow can run this same job before it builds anything,
  # rather than keeping a second copy of it that drifts.
  workflow_call:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: xcodebuild -scheme PassQuickAccess -destination 'platform=macOS' test
